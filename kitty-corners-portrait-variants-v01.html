<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitty Corners — варианты обрамления портрета</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FDF7EE; --surface:#FFF; --ink:#443E4C; --ink-soft:#8A8093;
    --line:#EBDFCC; --edge:#E5D6BD; --accent:#FF9457; --accent-edge:#E0763B;
    --r1:#F4C892; --r2:#A9DBF5; --r3:#93D4B8; --r9:#C7BCE8;
    --shadow:0 6px 16px rgba(90,70,60,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#efe6d6;color:var(--ink);font-family:'Nunito',sans-serif;padding:28px 18px 60px}
  .head{max-width:1120px;margin:0 auto 8px;text-align:center}
  .head h1{font-family:'Baloo 2';font-weight:800;font-size:25px;margin:0 0 6px}
  .head p{margin:0 0 4px;color:#6b6472;font-size:14px}
  .switch{max-width:1120px;margin:14px auto 24px;text-align:center}
  .switch button{font-family:'Baloo 2';font-weight:700;font-size:13px;border:1.5px solid var(--line);
    background:var(--surface);border-radius:999px;padding:7px 14px;margin:3px;cursor:pointer;color:var(--ink)}
  .switch button.on{background:var(--accent);color:#fff;border-color:var(--accent-edge)}

  .grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px}
  .tile{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px 14px 16px;text-align:center}
  .stage{height:170px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
  .tag{font-family:'Baloo 2';font-weight:800;font-size:14px}
  .note{font-size:11.5px;color:#6b6472;line-height:1.4;margin-top:4px}
  .pill{display:inline-block;font-family:'Baloo 2';font-weight:800;font-size:10px;color:#fff;background:var(--accent);
    border-radius:999px;padding:2px 9px;margin-bottom:8px;letter-spacing:.5px}

  /* box baseline */
  .box{width:140px;height:140px;position:relative;display:flex;align-items:center;justify-content:center}
  .box img{width:116px;height:116px;object-fit:contain;position:relative;z-index:2}

  /* A · circle contained (current) */
  .a{border-radius:50%;background:var(--r1);box-shadow:inset 0 -6px 14px rgba(0,0,0,.08)}

  /* B · squircle */
  .b{border-radius:38px;background:var(--r2);box-shadow:inset 0 -6px 14px rgba(0,0,0,.07)}

  /* C · circle, cat pops out over the top */
  .c{border-radius:50%;background:var(--r3);overflow:visible}
  .c img{width:150px;height:150px;position:absolute;left:50%;bottom:-4px;transform:translateX(-50%)}

  /* D · circle, cat peeks (bottom-cropped) */
  .d{border-radius:50%;background:var(--r9);overflow:hidden}
  .d img{width:150px;height:150px;position:absolute;left:50%;bottom:-22px;transform:translateX(-50%)}

  /* E · no shape — float on soft glow + ground shadow */
  .e{background:radial-gradient(circle at 50% 44%, rgba(255,148,87,.20), rgba(255,148,87,0) 62%)}
  .e::after{content:"";position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    width:96px;height:20px;border-radius:50%;background:rgba(90,70,60,.20);filter:blur(4px);z-index:1}

  /* F · wooden plaque frame (uses plaque_blank asset) */
  .f{background:url('game/src/assets/plaque_blank.webp') center/contain no-repeat}
  .f img{width:96px;height:96px}

  /* G · ring + pedestal shelf */
  .g{border-radius:50%;background:var(--r1);border:3px solid #fff;
    box-shadow:0 0 0 2px var(--edge), inset 0 -6px 14px rgba(0,0,0,.08)}
  .g::after{content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:104px;height:14px;border-radius:999px;background:var(--edge);z-index:1}
  .g img{bottom:14px;position:absolute;left:50%;transform:translateX(-50%);width:120px;height:120px}

  /* H · rounded tile, paw pattern + pressable edge */
  .h{border-radius:26px;background:var(--surface) url('game/src/assets/paw.webp');
    background-size:34px;background-blend-mode:multiply;border:1.5px solid var(--line);
    border-bottom:5px solid var(--edge);overflow:hidden}
  .h .paw-wash{position:absolute;inset:0;background:rgba(255,255,255,.78);z-index:1}

  /* I · circle with contrasting inner disc (cat contained, smaller disc) */
  .i{border-radius:50%;background:linear-gradient(160deg,var(--r2),#8fc9ef)}
  .i .disc{position:absolute;width:104px;height:104px;border-radius:50%;background:#fff;opacity:.55;z-index:1}
  .i img{width:104px;height:104px}
</style>
</head>
<body>
  <div class="head">
    <h1>Обрамление портрета котика — варианты</h1>
    <p>Один и тот же спрайт во всех вариантах для честного сравнения. On-brand (§6.4).</p>
    <p style="font-size:12.5px">Проблема варианта A: сидящий кот не садится в идеальный круг — низ упирается, по бокам пусто.</p>
  </div>

  <div class="switch">
    <span style="font-size:12px;color:#6b6472;margin-right:6px">Спрайт:</span>
    <button data-img="k3_bengal" class="on">Bengal</button>
    <button data-img="k3_ragdoll">Ragdoll</button>
    <button data-img="k_white_idle">White</button>
    <button data-img="k3_sphynx">Sphynx</button>
    <button data-img="k3_bombay">Bombay</button>
  </div>

  <div class="grid" id="grid"></div>

<script>
  const A='game/src/assets/';
  const variants=[
    ['a','A · Круг (текущий)','Идеальный круг. Кот не заполняет форму — низ обрезан, по бокам воздух. Базовый для сравнения.'],
    ['b','B · Squircle','Скруглённый квадрат — сидящий кот садится естественнее, форма «дышит» с телом.'],
    ['c','C · Круг + pop-out','Кот крупнее круга и «выходит» за верх — живо, объёмно, голова не зажата.'],
    ['d','D · Круг-«выглядывает»','Кот кадрируется кругом снизу (как из миски) — крупная морда, узнаваемо.'],
    ['e','E · Без формы + тень','Кот «парит» на мягком свечении с тенью-эллипсом. Минимализм, максимум характера.'],
    ['f','F · Деревянная плашка','Рамка из ассета plaque_blank — уютно, в духе UI-атласа игры.'],
    ['g','G · Круг + подиум','Круг с белым кольцом и «полочкой» — кот стоит/сидит на подиуме, как трофей.'],
    ['h','H · Плитка + лапки','Скруглённая плитка с паттерном лапок и «нажимаемым» краем (§6.7).'],
    ['i','I · Круг + внутр. диск','Два круга: цветной фон + светлый диск, кот на диске — центрирует и добавляет глубины.'],
  ];
  const grid=document.getElementById('grid');
  let cur='k3_bengal';
  function render(){
    grid.innerHTML='';
    variants.forEach(([cls,tag,note])=>{
      const t=document.createElement('div');t.className='tile';
      const extra = cls==='i' ? '<span class="disc"></span>' : (cls==='h' ? '<span class="paw-wash"></span>' : '');
      t.innerHTML=`<div class="stage"><div class="box ${cls}">${extra}<img src="${A+cur}.webp" alt=""/></div></div>
        ${cls==='a'?'<span class="pill">CURRENT</span><br>':''}
        <div class="tag">${tag}</div><div class="note">${note}</div>`;
      grid.appendChild(t);
    });
  }
  document.querySelectorAll('.switch button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.switch button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');cur=b.dataset.img;render();
  }));
  render();
</script>
</body>
</html>
